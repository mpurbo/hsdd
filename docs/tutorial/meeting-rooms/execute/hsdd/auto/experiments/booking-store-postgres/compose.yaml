# Throwaway PostgreSQL 17 for the probe: a host port on 127.0.0.1 only, no volume.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_DB: probe
    ports:
      - "127.0.0.1:55499:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d probe"]
      interval: 1s
      timeout: 3s
      retries: 30
